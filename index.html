<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schvalování dokumentů – Oáza klidu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f4;
  --surface: #ffffff;
  --ink: #1d2427;
  --muted: #5d686d;
  --line: #d8dddd;
  --line-soft: #eceff0;
  --accent: #1f5f73;
  --accent-soft: #e2eef1;
  --s-jarda: #9aa5a9;
  --s-gestor: #4f93a8;
  --s-red: #b97a17;
  --s-done: #2f7a3e;
  --red-soft: #fbf1e2;
  --done-soft: #e5f2e7;
  --ok: #2f7a3e;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191b; --surface: #1d2326; --ink: #e4e8e9; --muted: #9aa5a9; --line: #333c40; --line-soft: #283034;
    --accent: #7fc3d6; --accent-soft: #23353b; --s-jarda: #6b777b; --s-gestor: #4d8fa3; --s-red: #e3a646; --s-done: #7fcf8c;
    --red-soft: #33291a; --done-soft: #1d3122; --ok: #5fb56c; --bad: #ff8a80; --bad-soft: #3a1f1d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); border-color: var(--line); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; }
input[readonly] { background: var(--bg); }
textarea { width: 100%; resize: vertical; min-height: 120px; font-size: 16px; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 600; }
header.top h1 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.spacer { flex: 1; }
.status { font-size: 12.5px; color: var(--muted); }
.status.err { color: var(--bad); font-weight: 600; }
.me-name { font-size: 14px; color: var(--muted); }
.me-name b { color: var(--ink); }

main { max-width: 1000px; margin: 0 auto; padding: 18px 20px 60px; }

/* ---------- obrazovky ---------- */
.simple { max-width: 1080px; margin: 0 auto; font-size: 17px; }
.simple.narrow { max-width: 600px; }
.simple .back { display: inline-block; font-size: 16px; color: var(--accent); text-decoration: none; padding: 4px 0; margin-bottom: 6px; }
.hello { font-size: 26px; font-weight: 700; margin: 8px 0 4px; }
.lead { font-size: 18px; margin: 0 0 16px; color: var(--muted); }
.kick, .scr .kick { font-size: 15px; font-weight: 500; color: var(--muted); margin: 0 0 2px; }
.item { position: relative; }
.gbadge { position: absolute; top: 12px; right: 14px; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
.items { display: flex; flex-direction: column; gap: 12px; }
.items.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.item { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; }
.item:hover, .item:focus-visible { border-color: var(--accent); }
.item .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item .txt .kick { font-size: 13px; }
.item b { font-size: 19px; font-weight: 700; line-height: 1.25; }
.item small { font-size: 14.5px; color: var(--muted); }
.item .line { font-size: 14.5px; color: var(--ink); margin-top: 4px; }
.item .line .sw { vertical-align: 0; margin-right: 2px; }
.item.warn { border-color: var(--bad); }
.item.warn .line { color: var(--bad); font-weight: 600; }
.item .cnt { margin-left: auto; font-size: 18px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; min-width: 36px; padding: 2px 10px; text-align: center; }
.item .arr { margin-left: auto; font-size: 24px; color: var(--accent); line-height: 1; }
.item .cnt + .arr { margin-left: 10px; }
.scr h2 { font-size: 26px; margin: 0 0 16px; font-weight: 700; }
.scr p { margin: 0 0 14px; }
.scr .sub { font-size: 16px; margin: -8px 0 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; position: sticky; top: 70px; }
.side-q { font-size: 16px; margin: 0 0 14px !important; }
table.dt { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 16px; }
table.dt th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg); }
table.dt td { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.dt tr:last-child td { border-bottom: 0; }
table.dt .code { font-family: var(--f-mono); font-size: 14px; color: var(--accent); white-space: nowrap; width: 1%; }
table.dt .dp { font-size: 14px; color: var(--muted); }
table.dt .r { text-align: right; white-space: nowrap; width: 1%; color: var(--muted); }
.bigbtn { display: block; width: 100%; font-size: 16px; font-weight: 600; padding: 10px 16px; border-radius: 8px; margin-bottom: 10px; }
.narrow .bigbtn { display: inline-block; width: auto; min-width: 200px; }
a.bigbtn { text-align: center; text-decoration: none; }
.bigbtn.yes { background: var(--ok); border: 1px solid var(--ok); color: #fff; }
.bigbtn.no { background: var(--surface); border: 1px solid var(--bad); color: var(--bad); }
.bigbtn.go { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
.bigbtn.plain { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 15px; }
.scr textarea { min-height: 160px; font-size: 16px; margin-bottom: 12px; }
.done-scr { text-align: center; padding-top: 24px; }
.done-scr .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 32px; line-height: 56px; margin: 0 auto 12px; }
.done-scr h2 { margin-bottom: 6px; }
.done-scr .muted { margin-bottom: 20px; }
.done-scr .undo { margin-top: 10px; font-size: 16px; }
.nothing { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 30px 22px; font-size: 20px; text-align: center; max-width: 600px; }
.sw.c-back { background: var(--bad); }
.scr .vr { margin-bottom: 14px; font-size: 16px; }
.sumline { font-size: 19px; margin: 0 0 8px; }
.simple .bar { margin: 0 0 8px; height: 12px; }
.simple .legend { margin-bottom: 18px; font-size: 14px; }
.undo-line { text-align: center; font-size: 15px; margin: 4px 0 0 !important; }
.simple .tl { margin-top: 16px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.simple .link-row { margin-bottom: 10px; font-size: 16px; }
.simple .wave-meta { margin-bottom: 16px; font-size: 15px; }
@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .side { position: static; }
}
@media (max-width: 600px) {
  .simple { font-size: 17px; }
  table.dt thead { display: none; }
  table.dt .r.v { display: none; }
  table.dt td { padding: 10px; }
  table.dt .code { font-size: 12.5px; }
}

/* ---------- přehled (Jarda) ---------- */
.sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-bottom: 14px; }
.sum .big { font-size: 20px; font-weight: 700; }
.bar { flex: 1 1 260px; display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-soft); }
.bar span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); flex-basis: 100%; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.c-jarda { background: var(--s-jarda); } .c-gestor { background: var(--s-gestor); } .c-red { background: var(--s-red); } .c-done { background: var(--s-done); }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); margin-bottom: 6px; }
.tabs button { border: 0; border-radius: 0; padding: 6px 14px; border-right: 1px solid var(--line); }
.tabs button:last-child { border-right: 0; }
.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.back { margin: 0 0 12px; }

.wave { margin-top: 16px; }
.wave-h { display: flex; align-items: baseline; gap: 10px; padding: 6px 4px; cursor: pointer; user-select: none; }
.wave-h .chev { color: var(--muted); font-size: 11px; width: 12px; transition: transform .15s; }
.wave.closed .wave-h .chev { transform: rotate(-90deg); }
.wave-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
.wave-h .sq { font-size: 13px; color: var(--muted); }
.wave-h .cnt { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.wave-h .cnt.done { color: var(--s-done); font-weight: 600; }
.wave-note { font-size: 13px; color: var(--muted); margin: 0 0 6px 26px; }
.wave.closed .wave-body { display: none; }
.wave-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 12px; margin: 0 0 6px; border: 1px solid var(--s-red); border-radius: 8px; background: var(--red-soft); font-size: 13.5px; }
.wave-meta label { display: inline-flex; align-items: center; gap: 6px; }
.wave-meta input[type=text] { width: 130px; }
.wave-meta input[type=date] { width: 150px; }
.wave-meta input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.wave-meta .rusi { flex-basis: 100%; color: var(--muted); }
.wave-meta .rusi b { color: var(--ink); font-weight: 600; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.bal + .bal { border-top: 1px solid var(--line-soft); }
.bal-h { display: grid; grid-template-columns: minmax(0, 1fr) 190px 190px; align-items: center; gap: 6px 14px; padding: 9px 14px; cursor: pointer; }
.bal-h:hover { background: var(--bg); }
.bal-h .n { font-weight: 600; }
.bal-h .g { font-size: 13px; color: var(--muted); }
.chip { justify-self: start; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: var(--line-soft); color: var(--muted); }
.chip.st-gestor { background: var(--accent-soft); color: var(--accent); }
.chip.st-red { background: var(--red-soft); color: var(--s-red); }
.chip.st-done { background: var(--done-soft); color: var(--s-done); }
.chip.st-back { background: var(--bad-soft); color: var(--bad); }
.bal-h .a { justify-self: end; }
.bal-h .a button { white-space: nowrap; }
.vr { padding: 8px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); white-space: pre-wrap; }
.vr b { font-weight: 600; }
.bal-b { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); border-top: 1px solid var(--line-soft); }
table.docs { width: 100%; border-collapse: collapse; font-size: 14px; }
table.docs td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.docs tr:last-child td { border-bottom: 0; }
table.docs .code { font-family: var(--f-mono); font-size: 13px; color: var(--accent); white-space: nowrap; width: 1%; }
table.docs .dp { font-size: 12.5px; color: var(--muted); }
table.docs .r { text-align: right; white-space: nowrap; width: 1%; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.tl li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 2px 0; }
.tl .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .x { color: var(--bad); white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); }

.gate { max-width: 460px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
.gate h2 { font-size: 19px; margin: 0 0 8px; }
.gate .row { margin-top: 12px; }
.gate input { flex: 1; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.pick button { padding: 14px; font-size: 17px; font-weight: 600; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, 94vw); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .4); }
.dlg-h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { margin: 0; font-size: 18px; font-weight: 600; }
.dlg-b { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.dlg-b label { display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.dlg-b .big-btns button { font-size: 16px; padding: 10px 18px; }
.link-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.link-row input { font-size: 12.5px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 24px); }
#toast.on { opacity: .97; pointer-events: auto; }
#toast button { background: transparent; color: var(--surface); border: 1px solid currentColor; padding: 4px 10px; font-weight: 600; }

@media (max-width: 760px) {
  header.top { padding: 8px 12px; }
  main { padding: 12px 10px 50px; }
  .task { padding: 16px 14px 18px; }
  .task ul.docs li { grid-template-columns: 70px minmax(0, 1fr); }
  .task ul.docs .s { display: none; }
  .big-btns button { flex: 1 1 100%; }
  .bal-h { grid-template-columns: minmax(0, 1fr) auto; }
  .bal-h .chip { grid-column: 1; }
  .bal-h .a { grid-column: 2; grid-row: 1 / span 2; }
  .wave-note { margin-left: 4px; }
  .link-row { grid-template-columns: 1fr auto; }
  .link-row span { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Schvalování dokumentů</h1>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <span class="me-name" id="me" hidden></span>
</header>

<div id="gate" hidden>
  <section class="gate">
    <h2>Schvalování řízené dokumentace</h2>
    <p id="gate-msg">Otevřete prosím odkaz, který vám poslal Jarda. Nebo sem vložte klíč.</p>
    <form class="row" id="gate-form"><input id="gate-key" placeholder="Klíč" autocomplete="off"><button class="primary">Otevřít</button></form>
  </section>
</div>

<div id="who" hidden>
  <section class="gate">
    <h2>Kdo jste?</h2>
    <div class="pick" id="pick"></div>
  </section>
</div>

<main id="main" hidden></main>

const dm = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getDate()}. ${d.getMonth() + 1}.` + (d.getFullYear() !== new Date().getFullYear() ? ` ${d.getFullYear()}` : ''); };
const full = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('cs-CZ'); };
const vb = (u, base) => P[u]?.m ? base : base.replace(/l$/, 'la');
const ls = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} } };

// ---------- kroky ----------
function steps(b) {
  if (b.g === 'jarda') return ['precteno', 'predano', 'reditelka'];
  if (b.g === 'jitka') return ['precteno', 'odeslano', 'reditelka'];
  return ['precteno', 'odeslano', 'gestor', 'predano', 'reditelka'];
}
const actor = (b, k) => (k === 'precteno' || k === 'odeslano') ? 'jarda' : k === 'reditelka' ? 'jitka' : b.g;
function stepName(b, k) {
  const g = P[b.g];
  return { precteno: 'Jarda pročetl', odeslano: `Posláno ${g.d}`, gestor: `${g.n} ${vb(b.g, 'schválil')}`,
    predano: `${g.n} ${vb(b.g, 'předal')} ředitelce`, reditelka: 'Ředitelka schválila' }[k];
}
const emptyBal = () => ({ kroky: {}, vraceno: null, pozn: {}, hist: [], upr: '' });
const emptyVlna = () => ({ rozhodnuti: '', ucinnost: '', podepsano: null, seznameni: null, upr: '' });
const st = id => S.bal[id] || emptyBal();
const nextStep = b => steps(b).find(k => !st(b.id).kroky?.[k]) || null;
const holder = b => { const k = nextStep(b); return k ? actor(b, k) : null; };
const lastDone = b => { const ks = steps(b).filter(k => st(b.id).kroky?.[k]); return ks.length ? ks[ks.length - 1] : null; };
function stage(b) {
  const k = nextStep(b);
  if (!k) return 'done';
  if (k === 'reditelka') return 'red';
  return actor(b, k) === 'jarda' ? 'jarda' : 'gestor';
}
function statusText(b) {
  const k = nextStep(b), g = P[b.g], s = st(b.id);
  if (!k) return 'Schváleno ' + dm(s.kroky.reditelka?.t);
  if (k === 'precteno' && s.vraceno) return 'Vráceno s připomínkami';
  return { precteno: 'Čte Jarda', odeslano: `Jarda pošle ${g.d}`, gestor: `Schvaluje ${g.n}`, predano: `${g.n} předá ředitelce`, reditelka: 'Schvaluje ředitelka' }[k];
}
const pages = b => b.d.reduce((s, c) => s + (DOCS[c]?.s || 0), 0);
const myWaiting = () => BAL.filter(b => holder(b) === S.user);

// ---------- akce ----------
async function run(id, fn) {
  if (!api) return false;
  S.busy.add(id); render(); setStatus('Ukládám…');
  try { await fn(); setStatus(''); return true; }
  catch (e) { console.error(e); setStatus(/^Krok/.test(e?.message || '') ? e.message : 'Nepodařilo se uložit. Zkuste to prosím znovu.', true); return false; }
  finally { S.busy.delete(id); render(); }
}
async function doStep(b, k) {
  const h = actor(b, k), me = S.user;
  if (me !== h && me !== 'jarda') return;
  if (me !== h && !confirm(`Zapsat za ${P[h].a}: ${stepName(b, k)}?`)) return;
  const ok = await run(b.id, () => api.bal(b.id, cur => {
    const nk = steps(b).find(x => !cur.kroky[x]);
    if (nk !== k) throw new Error('Krok už mezitím někdo potvrdil.');
    const t = nowIso();
    cur.kroky[k] = { u: me, t };
    if (k === 'precteno') cur.vraceno = null;
    cur.hist.push({ k, u: me, t });
  }));
  if (ok) goHash(`ok-${b.id}-${k}`);
}
function undo(b, k, quiet) {
  const me = S.user;
  return run(b.id, () => api.bal(b.id, cur => {
    if (!cur.kroky[k]) return;
    if (steps(b).slice(steps(b).indexOf(k) + 1).some(x => cur.kroky[x])) throw new Error('Krok už nejde vzít zpět, navazuje na něj další.');
    delete cur.kroky[k];
    cur.hist.push({ k: 'zpet', u: me, t: nowIso(), x: k });
  })).then(ok => { if (ok && quiet) toast('Vzato zpět'); return ok; });
}
function doReturn(b, text) {
  const me = S.user;
  return run(b.id, () => api.bal(b.id, cur => {
    const t = nowIso();
    cur.kroky = {}; cur.vraceno = { u: me, t, x: text };
    cur.hist.push({ k: 'vraceno', u: me, t, x: text });
  })).then(ok => { if (ok) goHash(`ok-${b.id}-vraceno`); });
}
function doWave(wid, fn) { return run('w-' + wid, () => api.vlna(wid, fn)); }

// ---------- obrazovky: jedna věc na obrazovku ----------
function route() {
  const h = location.hash;
  let m = /^#(b|r|ok)-([A-Z]\d+)(?:-(\w+))?$/.exec(h); if (m) return { s: m[1], id: m[2], x: m[3] };
  m = /^#v-([A-Z])$/.exec(h); if (m) return { s: 'v', id: m[1] };
  m = /^#(ukoly|prehled|odkazy)$/.exec(h); if (m) return { s: m[1] };
  return { s: 'home' };
}
const goHash = h => { location.hash = h; };
const backLink = (href, label = 'Zpět') => `<a class="back" href="${href}">‹ ${label}</a>`;
const bn = b => `Balíček ${b.n}`;
const meta = b => { const pg = pages(b); return `${plural(b.d.length, 'dokument', 'dokumenty', 'dokumentů')}${pg ? ` · ${pg} str.` : ''}`; };
function jardaAct(b, k) { return k === 'precteno' ? 'Pročetl jsem' : k === 'odeslano' ? `Poslal jsem ${P[b.g].d}` : 'Předal jsem ředitelce'; }
function todo(b) {
  const k = nextStep(b), s = st(b.id);
  if (k === 'precteno') return s.vraceno ? 'vráceno s připomínkami' : 'pročíst';
  if (k === 'odeslano') return 'poslat ' + P[b.g].d;
  if (k === 'predano') return 'předat ředitelce';
  return '';
}
// dlaždice balíčku: číslo, název, rozsah a jedna stavová řádka
function tile(b, line, cls = '', showG = false) {
  return `<a class="item bal ${cls}${showG ? ' has-g' : ''}" href="#b-${b.id}">${showG ? `<span class="gbadge" title="Gestor">${esc(P[b.g].n)}</span>` : ''}<span class="txt"><span class="kick">${bn(b)}</span><b>${esc(b.t)}</b><small>${meta(b)}</small>${line ? `<span class="line">${line}</span>` : ''}</span><span class="arr">›</span></a>`;
}
function docTable(b, admin) {
  const rows = b.d.map(c => { const d = DOCS[c] || { n: c };
    return `<tr><td class="code">${c}</td><td>${esc(d.n)}${d.p ? `<div class="dp">včetně: ${esc(d.p)}</div>` : ''}</td>${admin ? `<td class="r v">${d.v ? 'v' + esc(d.v) : ''}</td>` : ''}<td class="r">${d.x ? 'tabulka' : d.s ? d.s + ' str.' : ''}</td></tr>`; }).join('');
  return `<table class="dt"><thead><tr><th>Kód</th><th>Dokument</th>${admin ? '<th class="r v">Verze</th>' : ''}<th class="r">Rozsah</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function screen() {
  const r = route(), me = S.user, admin = me === 'jarda', b = r.id && BY_ID[r.id];
  if (r.s === 'ok' && b) return screenDone(b, r.x);
  if (r.s === 'r' && b && holder(b) === me && !admin) return screenRet(b);
  if (r.s === 'b' && b && (admin || holder(b) === me)) return admin ? screenBalAdmin(b) : screenBal(b);
  if (admin) {
    if (r.s === 'ukoly') return screenTasks();
    if (r.s === 'prehled') return screenOverview();
    if (r.s === 'v' && WAVES.some(w => w.id === r.id)) return screenWave(WAVES.find(w => w.id === r.id));
    if (r.s === 'odkazy') return screenLinks();
    return screenHomeAdmin();
  }
  return screenHome();
}

// --- gestorky a ředitelka ---
function screenHome() {
  const me = S.user, list = myWaiting();
  const head = `<p class="hello">Dobrý den, ${esc(P[me].v)}.</p>`;
  if (!list.length) return `<div class="simple">${head}<div class="nothing">Teď nemáte nic ke schválení.</div></div>`;
  const lead = list.length === 1 ? 'Ke schválení máte 1 balíček:' : `Ke schválení máte ${plural(list.length, 'balíček', 'balíčky', 'balíčků')}:`;
  return `<div class="simple">${head}<p class="lead">${lead}</p><div class="items grid">${list.map(b =>
    tile(b, nextStep(b) === 'predano' ? 'Schváleno, předat ředitelce' : '')).join('')}</div></div>`;
}
function screenBal(b) {
  const k = nextStep(b), me = S.user, busy = S.busy.has(b.id) ? 'disabled' : '';
  const head = `${backLink('#seznam')}<p class="kick">${bn(b)}</p><h2>${esc(b.t)}</h2>`;
  if (k === 'predano') {
    return `<div class="simple scr narrow">${head}<p>Dokumenty jste ${vb(me, 'schválil')}. Teď je předejte ředitelce.</p>
      <button type="button" class="bigbtn yes" data-act="predano" data-id="${b.id}" ${busy}>${vb(me, 'Předal')} jsem ředitelce</button></div>`;
  }
  return `<div class="simple scr">${head}<div class="split"><div class="mainc">${docTable(b, false)}</div>
    <aside class="side"><p class="side-q">${k === 'reditelka' ? 'Souhlasíte s dokumenty?' : 'Odpovídají dokumenty tomu, jak to v domově děláme?'}</p>
      <button type="button" class="bigbtn yes" data-act="${k}" data-id="${b.id}" ${busy}>Schvaluji</button>
      <a class="bigbtn no" href="#r-${b.id}">Mám připomínky</a></aside></div></div>`;
}
function screenRet(b) {
  const busy = S.busy.has(b.id) ? 'disabled' : '';
  return `<div class="simple scr narrow">${backLink('#b-' + b.id)}<p class="kick">${bn(b)}</p><h2>${esc(b.t)}</h2><p>Napište, co je potřeba opravit:</p>
    <textarea id="ret-inline"></textarea>
    <button type="button" class="bigbtn go" data-send="${b.id}" ${busy}>Odeslat Jardovi</button></div>`;
}
function screenDone(b, x) {
  const s = st(b.id), me = S.user, admin = me === 'jarda';
  const title = x === 'vraceno' ? 'Odesláno Jardovi' : x === 'predano' ? 'Předáno ředitelce' : x === 'odeslano' ? `Posláno ${P[b.g].d}` : x === 'precteno' ? 'Přečteno' : 'Schváleno';
  const canUndo = x !== 'vraceno' && s.kroky?.[x]?.u === me && lastDone(b) === x;
  const next = admin ? (holder(b) === 'jarda' ? '#b-' + b.id : S.backTo || '#ukoly') : '#seznam';
  return `<div class="simple scr narrow done-scr"><div class="tick">✓</div><h2>${esc(title)}</h2><p class="muted">${bn(b)} · ${esc(b.t)}</p>
    <a class="bigbtn go" href="${next}">${admin ? 'Pokračovat' : 'Zpět na seznam'}</a>
    ${canUndo ? `<p class="undo"><button type="button" class="link" data-undo-simple="${b.id}" data-k="${x}">Omyl, vzít zpět</button></p>` : ''}</div>`;
}

// --- Jarda ---
function counts() { const c = { jarda: 0, gestor: 0, red: 0, done: 0 }; for (const b of BAL) c[stage(b)]++; return c; }
function bar(c, n) {
  const pct = v => (v / n * 100).toFixed(2) + '%';
  return `<div class="bar"><span class="c-done" style="width:${pct(c.done)}"></span><span class="c-red" style="width:${pct(c.red)}"></span><span class="c-gestor" style="width:${pct(c.gestor)}"></span><span class="c-jarda" style="width:${pct(c.jarda)}"></span></div>`;
}
function screenHomeAdmin() {
  const c = counts(), mine = myWaiting().length;
  return `<div class="simple"><p class="hello">Dobrý den, Jardo.</p><div class="items grid">
    <a class="item" href="#ukoly"><span class="txt"><b>Moje úkoly</b><small>balíčky, kde jsi na řadě</small></span><span class="cnt">${mine}</span><span class="arr">›</span></a>
    <a class="item" href="#prehled"><span class="txt"><b>Přehled schvalování</b><small>${c.done} z ${BAL.length} schváleno</small></span><span class="arr">›</span></a>
    ${api && !api.local ? '<a class="item" href="#odkazy"><span class="txt"><b>Odkazy pro gestory</b><small>osobní odkazy do appky</small></span><span class="arr">›</span></a>' : ''}
  </div></div>`;
}
function screenTasks() {
  const list = myWaiting();
  const body = list.length ? `<div class="items grid">${list.map(b => tile(b, esc(todo(b)), st(b.id).vraceno && nextStep(b) === 'precteno' ? 'warn' : '', true)).join('')}</div>`
    : '<div class="nothing">Teď na tebe nic nečeká.</div>';
  return `<div class="simple scr">${backLink('#seznam')}<h2>Moje úkoly</h2>${body}</div>`;
}
function screenOverview() {
  const c = counts(), n = BAL.length;
  const items = WAVES.map(w => {
    const all = BAL.filter(b => b.w === w.id), done = all.filter(b => stage(b) === 'done').length;
    const first = all[0].n, last = all[all.length - 1].n;
    return `<a class="item" href="#v-${w.id}"><span class="txt"><span class="kick">${w.id === 'X' ? 'Samostatně' : 'Vlna ' + w.id} · balíčky ${first === last ? first : first + '–' + last}</span><b>${esc(w.t)}</b><small>${waveText(w, done, all.length)}</small></span><span class="arr">›</span></a>`;
  }).join('');
  return `<div class="simple scr">${backLink('#seznam')}<h2>Přehled schvalování</h2>
    <p class="sumline"><b>${c.done} z ${n}</b> balíčků schváleno</p>${bar(c, n)}
    <div class="legend"><span><i class="sw c-jarda"></i>u Jardy <b>${c.jarda}</b></span><span><i class="sw c-gestor"></i>u gestorů <b>${c.gestor}</b></span><span><i class="sw c-red"></i>u ředitelky <b>${c.red}</b></span><span><i class="sw c-done"></i>schváleno <b>${c.done}</b></span></div>
    <div class="items grid">${items}</div></div>`;
}
function waveText(w, done, total) {
  const v = S.vlny[w.id] || emptyVlna();
  if (done < total || w.id === 'X') return `${done} z ${total} schváleno`;
  return v.seznameni ? 'Hotovo' : v.podepsano ? 'Podepsáno, chybí seznámení' : 'K podpisu rozhodnutí';
}
function screenWave(w) {
  const all = BAL.filter(b => b.w === w.id), done = all.filter(b => stage(b) === 'done').length;
  const v = S.vlny[w.id] || emptyVlna();
  const showMeta = w.id !== 'X' && (done === all.length || v.rozhodnuti || v.ucinnost || v.podepsano || v.seznameni);
  const metaBox = showMeta ? `<div class="wave-meta" data-w="${w.id}">
      <label>Rozhodnutí č. <input type="text" data-wf="rozhodnuti" value="${esc(v.rozhodnuti)}" placeholder="${esc(w.dec)}"></label>
      <label>Účinnost od <input type="date" data-wf="ucinnost" value="${esc(v.ucinnost)}"></label>
      <label><input type="checkbox" data-wc="podepsano" ${v.podepsano ? 'checked' : ''}> Podepsáno</label>
      <label><input type="checkbox" data-wc="seznameni" ${v.seznameni ? 'checked' : ''}> Zaměstnanci seznámeni</label>
      ${w.rusi ? `<span class="rusi"><b>Ruší:</b> ${esc(w.rusi)}</span>` : ''}</div>` : '';
  const items = all.map(b => { const sg = stage(b), back = nextStep(b) === 'precteno' && st(b.id).vraceno;
    return tile(b, `<i class="sw c-${back ? 'back' : sg}"></i> ${esc(statusText(b))}`, '', true); }).join('');
  return `<div class="simple scr">${backLink('#prehled')}<p class="kick">${w.id === 'X' ? 'Samostatně' : 'Vlna ' + w.id} · ${esc(w.sq)}</p><h2>${esc(w.t)}</h2>
    <p class="muted sub">${waveText(w, done, all.length)}${w.note ? ' · ' + esc(w.note) : ''}</p>${metaBox}<div class="items grid">${items}</div></div>`;
}
function screenBalAdmin(b) {
  const s = st(b.id), k = nextStep(b), h = holder(b), last = lastDone(b), busy = S.busy.has(b.id) ? 'disabled' : '';
  const back = S.backTo || '#v-' + b.w;
  let btn = '';
  if (k && h === 'jarda') btn = `<button type="button" class="bigbtn yes" data-act="${k}" data-id="${b.id}" ${busy}>${esc(jardaAct(b, k))}</button>`;
  else if (k) btn = `<button type="button" class="bigbtn plain" data-act="${k}" data-id="${b.id}" ${busy}>Zapsat za ${esc(P[h].a)}: ${esc(stepName(b, k).toLowerCase().replace(/^(dáša|helča|jitka|ředitelka) /, ''))}</button>`;
  const hist = (s.hist || []).map(e => {
    let t;
    if (e.k === 'vraceno') t = `${esc(P[e.u]?.n || '')} ${vb(e.u, 'vrátil')} s připomínkami`;
    else if (e.k === 'zpet') t = `${esc(P[e.u]?.n || '')} ${vb(e.u, 'vzal')} zpět: ${esc(stepName(b, e.x) || e.x)}`;
    else { t = esc(stepName(b, e.k)); if (e.u !== actor(b, e.k)) t += ` (zapsal${P[e.u]?.m ? '' : 'a'} ${esc(P[e.u]?.n || '')})`; }
    return `<li><span class="d" title="${esc(full(e.t))}">${dm(e.t)}</span><span>${t}</span></li>`;
  }).join('');
  return `<div class="simple scr">${backLink(back)}<p class="kick">${bn(b)} · ${b.w === 'X' ? 'samostatně' : 'vlna ' + b.w} · gestor ${esc(P[b.g].n)}</p><h2>${esc(b.t)}</h2>
    <div class="split"><div class="mainc">
      ${s.vraceno ? `<div class="vr"><b>Připomínka od ${esc(P[s.vraceno.u]?.g || '')}:</b> ${esc(s.vraceno.x)}</div>` : ''}
      ${docTable(b, true)}</div>
    <aside class="side"><p class="side-q">Gestor: <b>${esc(P[b.g].n)}</b><br>Teď: <b>${esc(statusText(b))}</b></p>
      ${btn}
      ${last ? `<p class="undo-line"><button type="button" class="link" data-undo="${last}" data-id="${b.id}" ${busy}>Vzít zpět: ${esc(stepName(b, last))}</button></p>` : ''}
      ${hist ? `<ul class="tl">${hist}</ul>` : ''}</aside></div></div>`;
}
function screenLinks() {
  const key = ls.get(LS_KEY) || '';
  const base = location.origin + location.pathname + '#k=' + encodeURIComponent(key);
  return `<div class="simple scr narrow">${backLink('#seznam')}<h2>Odkazy pro gestory</h2>
    ${PEOPLE.map(p => `<div class="link-row"><span>${esc(P[p].n)}</span><input readonly value="${esc(base + '&u=' + p)}"><button type="button" data-copy>Kopírovat</button></div>`).join('')}
    <p class="hint" style="margin-top:12px">Kdo má odkaz, vidí celé schvalování.</p></div>`;
}

function render() {
  if (!S.ready.b || !S.ready.v || !S.user) return;
  const ae = document.activeElement;
  if (ae && $('#main').contains(ae) && ae.matches('input[type=text], input[type=date], textarea')) { S.pending = true; return; }
  S.pending = false;
  $('#main').innerHTML = screen();
  $('#me').innerHTML = `<b>${esc(P[S.user].n)}</b>`; $('#me').hidden = false;
}

// ---------- stav a hlášky ----------
function setStatus(t, err) { const s = $('#status'); s.textContent = t || ''; s.className = 'status' + (err ? ' err' : ''); }
let toastT, toastUndo = null;
function toast(t, undoFn) {
  $('#toast-t').textContent = t; toastUndo = undoFn || null; $('#toast-undo').hidden = !undoFn;
  $('#toast').classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').classList.remove('on'); toastUndo = null; }, undoFn ? 9000 : 2600);
}
$('#toast-undo').addEventListener('click', () => { const f = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (f) f(); });

// ---------- události ----------
$('#main').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn?.dataset.send) { const x = ($('#ret-inline')?.value || '').trim(); if (!x) { $('#ret-inline').focus(); return; } doReturn(BY_ID[btn.dataset.send], x); return; }
  if (btn?.dataset.undoSimple) { const b = BY_ID[btn.dataset.undoSimple]; undo(b, btn.dataset.k).then(ok => { if (ok) goHash('b-' + b.id); }); return; }
  if (btn?.hasAttribute('data-copy')) { const inp = btn.parentElement.querySelector('input'); navigator.clipboard.writeText(inp.value).then(() => toast('Odkaz zkopírován'), () => inp.select()); return; }
  const el = e.target.closest('[data-id]'); if (!el) return;
  const b = BY_ID[el.dataset.id];
  if (btn?.dataset.act) { doStep(b, btn.dataset.act); return; }
  if (btn?.dataset.undo) { if (confirm(`Vzít zpět krok „${stepName(b, btn.dataset.undo)}“?`)) undo(b, btn.dataset.undo); return; }
});
$('#main').addEventListener('change', e => {
  const t = e.target, wm = t.closest('.wave-meta'); if (!wm || S.user !== 'jarda') return;
  const wid = wm.dataset.w, me = S.user;
  if (t.dataset.wf) { const val = t.value.trim(); doWave(wid, cur => { cur[t.dataset.wf] = val; }); }
  if (t.dataset.wc) { const on = t.checked; doWave(wid, cur => { cur[t.dataset.wc] = on ? { u: me, t: nowIso() } : null; }); }
});
$('#main').addEventListener('focusout', () => setTimeout(() => { if (S.pending) render(); }, 0));
$('#main').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[type=text]')) e.target.blur(); });


// ---------- kdo jsem a odkazy ----------
function showWho() {
  $('#main').hidden = true; $('#who').hidden = false; $('#me').hidden = true;
  $('#pick').innerHTML = PEOPLE.map(p => `<button type="button" data-u="${p}">${esc(P[p].n)}</button>`).join('');
}
$('#pick').addEventListener('click', e => { const b = e.target.closest('button[data-u]'); if (b) setUser(b.dataset.u); });
function setUser(u) {
  if (!P[u]) return;
  S.user = u; ls.set(LS_USER, u);
  $('#who').hidden = true; $('#main').hidden = false; render();
}

// ---------- data ----------
function onBal(entries) { S.bal = Object.fromEntries(entries); S.ready.b = true; render(); }
function onVlny(entries) { S.vlny = Object.fromEntries(entries); S.ready.v = true; render(); }
const norm = d => ({ ...emptyBal(), ...d, kroky: { ...(d?.kroky || {}) }, pozn: { ...(d?.pozn || {}) }, hist: [...(d?.hist || [])] });

async function connectFirebase(key) {
  const [{ initializeApp }, F] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);
  const app = initializeApp(FIREBASE, 'rd');
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); }
  const balCol = F.collection(db, ROOT, key, 'balicky'), vlnyCol = F.collection(db, ROOT, key, 'vlny');
  const denied = e => {
    console.error(e);
    if (e && e.code === 'permission-denied') { ls.set(LS_KEY, null); showGate('Odkaz neplatí. Otevřete prosím znovu odkaz, který vám poslal Jarda.'); }
    else setStatus('Spojení se ztratilo, obnovte stránku.', true);
  };
  F.onSnapshot(balCol, s => onBal(s.docs.map(d => [d.id, d.data()])), denied);
  F.onSnapshot(vlnyCol, s => onVlny(s.docs.map(d => [d.id, d.data()])), denied);
  const tx = (col, id, empty, fn) => F.runTransaction(db, async t => {
    const ref = F.doc(col, id), snap = await t.get(ref);
    const cur = snap.exists() ? (col === balCol ? norm(snap.data()) : { ...empty(), ...snap.data() }) : empty();
    fn(cur); cur.upr = nowIso(); t.set(ref, cur);
  });
  api = { bal: (id, fn) => tx(balCol, id, emptyBal, fn), vlna: (id, fn) => tx(vlnyCol, id, emptyVlna, fn) };
}
function connectLocal() {
  const load = () => { try { return JSON.parse(localStorage.getItem(LS_DEMO)) || {}; } catch (e) { return {}; } };
  const db = load(); db.balicky = db.balicky || {}; db.vlny = db.vlny || {};
  const persist = () => { try { localStorage.setItem(LS_DEMO, JSON.stringify(db)); } catch (e) {} };
  const upd = async (coll, id, empty, fn, cb) => {
    await new Promise(r => setTimeout(r, 60));
    const cur = db[coll][id] ? (coll === 'balicky' ? norm(db[coll][id]) : { ...empty(), ...db[coll][id] }) : empty();
    fn(cur); cur.upr = nowIso(); db[coll][id] = JSON.parse(JSON.stringify(cur)); persist(); cb(Object.entries(db[coll]));
  };
  api = { local: true, bal: (id, fn) => upd('balicky', id, emptyBal, fn, onBal), vlna: (id, fn) => upd('vlny', id, emptyVlna, fn, onVlny) };
  onBal(Object.entries(db.balicky)); onVlny(Object.entries(db.vlny));
  setStatus('Zkušební režim');
}

// ---------- přístup ----------
function showGate(msg) {
  $('#main').hidden = true; $('#who').hidden = true; $('#me').hidden = true;
  $('#gate').hidden = false; if (msg) $('#gate-msg').textContent = msg;
}
$('#gate-form').addEventListener('submit', e => { e.preventDefault(); const k = $('#gate-key').value.trim(); if (k) { ls.set(LS_KEY, k); location.hash = ''; location.reload(); } });
function start() {
  const params = new URLSearchParams(location.search);
  const hk = /[#&]k=([^&]+)/.exec(location.hash), hu = /[#&]u=([a-z]+)/.exec(location.hash);
  if (hu && P[hu[1]]) { ls.set(LS_USER, hu[1]); ls.set(LS_FILTER, null); }
  if (hk) ls.set(LS_KEY, decodeURIComponent(hk[1]));
  if (hk || hu) history.replaceState(null, '', location.pathname + location.search);
  S.closed = new Set((ls.get(LS_CLOSED) || '').split(',').filter(Boolean));
  S.filter = ls.get(LS_FILTER);
  if (params.has('demo')) connectLocal();
  else {
    const key = ls.get(LS_KEY);
    if (!key) return showGate();
    setStatus('Načítám…');
    connectFirebase(key).then(() => setStatus('')).catch(e => { console.error(e); setStatus('Nepodařilo se připojit. Obnovte stránku.', true); });
  }
  const u = ls.get(LS_USER);
  if (u && P[u]) { S.user = u; $('#main').hidden = false; render(); }
  else showWho();
}
let prevHash = '';
window.addEventListener('hashchange', e => {
  if (/[#&](k|u)=/.test(location.hash)) { location.reload(); return; }
  const from = new URL(e.oldURL).hash, r = route();
  if (r.s === 'b' && /^#(ukoly|v-[A-Z]|seznam)?$/.test(from)) S.backTo = from || '#seznam';
  render(); window.scrollTo(0, 0);
});
start();
</script>
