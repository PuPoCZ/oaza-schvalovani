<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schvalování ŘD – Oáza klidu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f4;
  --surface: #ffffff;
  --ink: #1d2427;
  --muted: #5d686d;
  --line: #d8dddd;
  --line-soft: #eceff0;
  --accent: #1f5f73;
  --accent-soft: #e2eef1;
  --s-jarda: #9aa5a9;
  --s-gestor: #4f93a8;
  --s-red: #b97a17;
  --s-done: #2f7a3e;
  --red-soft: #fbf1e2;
  --done-soft: #e5f2e7;
  --ok: #2f7a3e;
  --bad: #b3261e;
  --bad-soft: #fbe9e7;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191b; --surface: #1d2326; --ink: #e4e8e9; --muted: #9aa5a9; --line: #333c40; --line-soft: #283034;
    --accent: #7fc3d6; --accent-soft: #23353b; --s-jarda: #6b777b; --s-gestor: #4d8fa3; --s-red: #e3a646; --s-done: #7fcf8c;
    --red-soft: #33291a; --done-soft: #1d3122; --ok: #5fb56c; --bad: #ff8a80; --bad-soft: #3a1f1d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); border-color: var(--line); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 9px; min-width: 0; }
input[readonly] { background: var(--bg); }
textarea { width: 100%; resize: vertical; min-height: 120px; font-size: 16px; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 600; }
header.top h1 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.spacer { flex: 1; }
.status { font-size: 12.5px; color: var(--muted); }
.status.err { color: var(--bad); font-weight: 600; }
.me-name { font-size: 14px; color: var(--muted); }
.me-name b { color: var(--ink); }

main { max-width: 1000px; margin: 0 auto; padding: 18px 20px 60px; }

/* ---------- jednoduchý pohled (gestoři, ředitelka) ---------- */
.simple { max-width: 720px; margin: 0 auto; }
.hello { font-size: 24px; font-weight: 700; margin: 6px 0 4px; }
.lead { font-size: 17px; margin: 0 0 18px; color: var(--muted); }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; margin-bottom: 16px; }
.task h2 { font-size: 21px; margin: 0 0 4px; font-weight: 700; }
.task .what { font-size: 16px; margin: 0 0 12px; }
.task .vr { margin: 0 0 12px; }
.task ul.docs { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--line-soft); }
.task ul.docs li { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 16px; }
.task ul.docs .c { font-family: var(--f-mono); font-size: 13.5px; color: var(--accent); padding-top: 2px; }
.task ul.docs .p { font-size: 13.5px; color: var(--muted); }
.task ul.docs .s { color: var(--muted); font-size: 14px; white-space: nowrap; padding-top: 1px; }
.big-btns { display: flex; flex-wrap: wrap; gap: 12px; }
.big-btns button { font-size: 17px; padding: 12px 22px; border-radius: 9px; font-weight: 600; }
.big-btns .yes { background: var(--ok); border-color: var(--ok); color: #fff; }
.big-btns .no { background: var(--surface); border: 2px solid var(--bad); color: var(--bad); }
.nothing { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 22px; font-size: 17px; text-align: center; }
.nothing b { display: block; font-size: 20px; margin-bottom: 6px; }
.foot { margin-top: 26px; text-align: center; font-size: 14px; color: var(--muted); }

/* ---------- přehled (Jarda) ---------- */
.sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-bottom: 14px; }
.sum .big { font-size: 20px; font-weight: 700; }
.bar { flex: 1 1 260px; display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-soft); }
.bar span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); flex-basis: 100%; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.c-jarda { background: var(--s-jarda); } .c-gestor { background: var(--s-gestor); } .c-red { background: var(--s-red); } .c-done { background: var(--s-done); }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); margin-bottom: 6px; }
.tabs button { border: 0; border-radius: 0; padding: 6px 14px; border-right: 1px solid var(--line); }
.tabs button:last-child { border-right: 0; }
.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.back { margin: 0 0 12px; }

.wave { margin-top: 16px; }
.wave-h { display: flex; align-items: baseline; gap: 10px; padding: 6px 4px; cursor: pointer; user-select: none; }
.wave-h .chev { color: var(--muted); font-size: 11px; width: 12px; transition: transform .15s; }
.wave.closed .wave-h .chev { transform: rotate(-90deg); }
.wave-h h2 { margin: 0; font-size: 16px; font-weight: 600; }
.wave-h .sq { font-size: 13px; color: var(--muted); }
.wave-h .cnt { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.wave-h .cnt.done { color: var(--s-done); font-weight: 600; }
.wave-note { font-size: 13px; color: var(--muted); margin: 0 0 6px 26px; }
.wave.closed .wave-body { display: none; }
.wave-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 8px 12px; margin: 0 0 6px; border: 1px solid var(--s-red); border-radius: 8px; background: var(--red-soft); font-size: 13.5px; }
.wave-meta label { display: inline-flex; align-items: center; gap: 6px; }
.wave-meta input[type=text] { width: 130px; }
.wave-meta input[type=date] { width: 150px; }
.wave-meta input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
.wave-meta .rusi { flex-basis: 100%; color: var(--muted); }
.wave-meta .rusi b { color: var(--ink); font-weight: 600; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.bal + .bal { border-top: 1px solid var(--line-soft); }
.bal-h { display: grid; grid-template-columns: minmax(0, 1fr) 190px 190px; align-items: center; gap: 6px 14px; padding: 9px 14px; cursor: pointer; }
.bal-h:hover { background: var(--bg); }
.bal-h .n { font-weight: 600; }
.bal-h .g { font-size: 13px; color: var(--muted); }
.chip { justify-self: start; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: var(--line-soft); color: var(--muted); }
.chip.st-gestor { background: var(--accent-soft); color: var(--accent); }
.chip.st-red { background: var(--red-soft); color: var(--s-red); }
.chip.st-done { background: var(--done-soft); color: var(--s-done); }
.chip.st-back { background: var(--bad-soft); color: var(--bad); }
.bal-h .a { justify-self: end; }
.bal-h .a button { white-space: nowrap; }
.vr { padding: 8px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); white-space: pre-wrap; }
.vr b { font-weight: 600; }
.bal-b { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); border-top: 1px solid var(--line-soft); }
table.docs { width: 100%; border-collapse: collapse; font-size: 14px; }
table.docs td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.docs tr:last-child td { border-bottom: 0; }
table.docs .code { font-family: var(--f-mono); font-size: 13px; color: var(--accent); white-space: nowrap; width: 1%; }
table.docs .dp { font-size: 12.5px; color: var(--muted); }
table.docs .r { text-align: right; white-space: nowrap; width: 1%; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.tl li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 2px 0; }
.tl .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .x { color: var(--bad); white-space: pre-wrap; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); }

.gate { max-width: 460px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
.gate h2 { font-size: 19px; margin: 0 0 8px; }
.gate .row { margin-top: 12px; }
.gate input { flex: 1; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.pick button { padding: 14px; font-size: 17px; font-weight: 600; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, 94vw); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, .4); }
.dlg-h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { margin: 0; font-size: 18px; font-weight: 600; }
.dlg-b { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.dlg-b label { display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.dlg-b .big-btns button { font-size: 16px; padding: 10px 18px; }
.link-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.link-row input { font-size: 12.5px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 24px); }
#toast.on { opacity: .97; pointer-events: auto; }
#toast button { background: transparent; color: var(--surface); border: 1px solid currentColor; padding: 4px 10px; font-weight: 600; }

@media (max-width: 760px) {
  header.top { padding: 8px 12px; }
  main { padding: 12px 10px 50px; }
  .task { padding: 16px 14px 18px; }
  .task ul.docs li { grid-template-columns: 70px minmax(0, 1fr); }
  .task ul.docs .s { display: none; }
  .big-btns button { flex: 1 1 100%; }
  .bal-h { grid-template-columns: minmax(0, 1fr) auto; }
  .bal-h .chip { grid-column: 1; }
  .bal-h .a { grid-column: 2; grid-row: 1 / span 2; }
  .wave-note { margin-left: 4px; }
  .link-row { grid-template-columns: 1fr auto; }
  .link-row span { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Schvalování ŘD<small>Oáza klidu</small></h1>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button type="button" class="ghost" id="b-links" hidden>Odkazy</button>
  <span class="me-name" id="me" hidden></span>
</header>

<div id="gate" hidden>
  <section class="gate">
    <h2>Schvalování řízené dokumentace</h2>
    <p id="gate-msg">Otevřete prosím odkaz, který vám poslal Jarda. Nebo sem vložte klíč.</p>
    <form class="row" id="gate-form"><input id="gate-key" placeholder="Klíč" autocomplete="off"><button class="primary">Otevřít</button></form>
  </section>
</div>

<div id="who" hidden>
  <section class="gate">
    <h2>Kdo jste?</h2>
    <div class="pick" id="pick"></div>
  </section>
</div>

<main id="main" hidden></main>

<dialog id="dlg-ret">
  <div class="dlg-h"><h2 id="ret-title">Mám připomínky</h2><span class="spacer"></span><button type="button" class="ghost" data-close>Zavřít</button></div>
  <form class="dlg-b" id="ret-form" method="dialog">
    <label>Napište, co je potřeba opravit:<textarea id="ret-text" required></textarea></label>
    <p class="hint">Dokumenty se vrátí Jardovi k opravě.</p>
    <div class="big-btns"><button class="primary" id="ret-ok">Odeslat Jardovi</button><button type="button" data-close>Zrušit</button></div>
  </form>
</dialog>

<dialog id="dlg-links">
  <div class="dlg-h"><h2>Odkazy</h2><span class="spacer"></span><button type="button" class="ghost" data-close>Zavřít</button></div>
  <div class="dlg-b" id="links"></div>
</dialog>

<div id="toast" role="status"><span id="toast-t"></span><button type="button" id="toast-undo" hidden>Vzít zpět</button></div>

// ---------- kroky ----------
function steps(b) {
  if (b.g === 'jarda') return ['precteno', 'predano', 'reditelka'];
  if (b.g === 'jitka') return ['precteno', 'odeslano', 'reditelka'];
  return ['precteno', 'odeslano', 'gestor', 'predano', 'reditelka'];
}
const actor = (b, k) => (k === 'precteno' || k === 'odeslano') ? 'jarda' : k === 'reditelka' ? 'jitka' : b.g;
function stepName(b, k) {
  const g = P[b.g];
  return { precteno: 'Jarda pročetl', odeslano: `Posláno ${g.d}`, gestor: `${g.n} ${vb(b.g, 'schválil')}`,
    predano: `${g.n} ${vb(b.g, 'předal')} ředitelce`, reditelka: 'Ředitelka schválila' }[k];
}
const emptyBal = () => ({ kroky: {}, vraceno: null, pozn: {}, hist: [], upr: '' });
const emptyVlna = () => ({ rozhodnuti: '', ucinnost: '', podepsano: null, seznameni: null, upr: '' });
const st = id => S.bal[id] || emptyBal();
const nextStep = b => steps(b).find(k => !st(b.id).kroky?.[k]) || null;
const holder = b => { const k = nextStep(b); return k ? actor(b, k) : null; };
const lastDone = b => { const ks = steps(b).filter(k => st(b.id).kroky?.[k]); return ks.length ? ks[ks.length - 1] : null; };
function stage(b) {
  const k = nextStep(b);
  if (!k) return 'done';
  if (k === 'reditelka') return 'red';
  return actor(b, k) === 'jarda' ? 'jarda' : 'gestor';
}
function statusText(b) {
  const k = nextStep(b), g = P[b.g], s = st(b.id);
  if (!k) return 'Schváleno ' + dm(s.kroky.reditelka?.t);
  if (k === 'precteno' && s.vraceno) return 'Vráceno s připomínkami';
  return { precteno: 'Čte Jarda', odeslano: `Jarda pošle ${g.d}`, gestor: `Schvaluje ${g.n}`, predano: `${g.n} předá ředitelce`, reditelka: 'Schvaluje ředitelka' }[k];
}
const pages = b => b.d.reduce((s, c) => s + (DOCS[c]?.s || 0), 0);
const myWaiting = () => BAL.filter(b => holder(b) === S.user);

// ---------- akce ----------
async function run(id, fn) {
  if (!api) return false;
  S.busy.add(id); render(); setStatus('Ukládám…');
  try { await fn(); setStatus(''); return true; }
  catch (e) { console.error(e); setStatus(/^Krok/.test(e?.message || '') ? e.message : 'Nepodařilo se uložit. Zkuste to prosím znovu.', true); return false; }
  finally { S.busy.delete(id); render(); }
}
async function doStep(b, k) {
  const h = actor(b, k), me = S.user;
  if (me !== h && me !== 'jarda') return;
  if (me !== h && !confirm(`Zapsat za ${P[h].a}: ${stepName(b, k)}?`)) return;
  const ok = await run(b.id, () => api.bal(b.id, cur => {
    const nk = steps(b).find(x => !cur.kroky[x]);
    if (nk !== k) throw new Error('Krok už mezitím někdo potvrdil.');
    const t = nowIso();
    cur.kroky[k] = { u: me, t };
    if (k === 'precteno') cur.vraceno = null;
    cur.hist.push({ k, u: me, t });
  }));
  if (ok) toast(`${b.t}: ${stepName(b, k)}`, () => undo(b, k, true));
}
function undo(b, k, quiet) {
  const me = S.user;
  return run(b.id, () => api.bal(b.id, cur => {
    if (!cur.kroky[k]) return;
    if (steps(b).slice(steps(b).indexOf(k) + 1).some(x => cur.kroky[x])) throw new Error('Krok už nejde vzít zpět, navazuje na něj další.');
    delete cur.kroky[k];
    cur.hist.push({ k: 'zpet', u: me, t: nowIso(), x: k });
  })).then(ok => { if (ok && quiet) toast('Vzato zpět'); });
}
function doReturn(b, text) {
  const me = S.user;
  return run(b.id, () => api.bal(b.id, cur => {
    const t = nowIso();
    cur.kroky = {}; cur.vraceno = { u: me, t, x: text };
    cur.hist.push({ k: 'vraceno', u: me, t, x: text });
  })).then(ok => { if (ok) toast('Připomínky jsou odeslané Jardovi'); });
}
function doWave(wid, fn) { return run('w-' + wid, () => api.vlna(wid, fn)); }

// ---------- jednoduchý pohled ----------
function renderSimple() {
  const me = S.user, list = myWaiting();
  const head = `<p class="hello">Dobrý den, ${esc(P[me].v)}.</p>`;
  const foot = `<p class="foot"><button type="button" class="link" data-overview>Jak je na tom celé schvalování</button></p>`;
  if (!list.length) {
    return `<div class="simple">${head}<div class="nothing"><b>Teď na vás nic nečeká.</b>Až vám Jarda pošle další dokumenty ke schválení, objeví se tady.</div>${foot}</div>`;
  }
  const lead = list.length === 1 ? 'Na vás čeká 1 balíček dokumentů.' : `Na vás čekají ${plural(list.length, 'balíček', 'balíčky', 'balíčků')} dokumentů.`;
  return `<div class="simple">${head}<p class="lead">${lead}</p>${list.map(taskCard).join('')}${foot}</div>`;
}
function taskCard(b) {
  const k = nextStep(b), s = st(b.id), busy = S.busy.has(b.id) ? 'disabled' : '', me = S.user;
  const docs = b.d.map(c => { const d = DOCS[c] || { n: c };
    return `<li><span class="c">${c}</span><span>${esc(d.n)}${d.p ? `<br><span class="p">včetně: ${esc(d.p)}</span>` : ''}</span><span class="s">${d.x ? 'tabulka' : d.s ? d.s + ' str.' : ''}</span></li>`; }).join('');
  let what, btns;
  if (k === 'predano') {
    what = `Dokumenty jste ${vb(me, 'schválil')}. Až je předáte ředitelce, klikněte na tlačítko.`;
    btns = `<button type="button" class="yes" data-act="predano" ${busy}>${vb(me, 'Předal')} jsem ředitelce</button>`;
  } else {
    what = k === 'reditelka' ? 'Přečtěte si prosím dokumenty a schvalte je, nebo napište připomínky.' : 'Přečtěte si prosím dokumenty a ověřte, že odpovídají tomu, jak to v domově děláme.';
    btns = `<button type="button" class="yes" data-act="${k}" ${busy}>✓ Schvaluji</button><button type="button" class="no" data-ret ${busy}>Mám připomínky</button>`;
  }
  const vr = s.vraceno ? `<div class="vr"><b>Připomínka od ${esc(P[s.vraceno.u]?.g || '')}:</b> ${esc(s.vraceno.x)}</div>` : '';
  return `<article class="task" data-id="${b.id}"><h2>${esc(b.t)}</h2><p class="what">${what}</p>${vr}
    <ul class="docs">${docs}</ul><div class="big-btns">${btns}</div></article>`;
}

// ---------- přehled ----------
function renderOverview() {
  const admin = S.user === 'jarda';
  const cnt = { jarda: 0, gestor: 0, red: 0, done: 0 };
  for (const b of BAL) cnt[stage(b)]++;
  const n = BAL.length, pct = v => (v / n * 100).toFixed(2) + '%';
  if (!S.filter) S.filter = admin && myWaiting().length ? 'mine' : 'all';
  const f = admin ? S.filter : 'all';
  const vis = b => f === 'mine' ? holder(b) === S.user : f === 'done' ? stage(b) === 'done' : true;
  const tabs = admin ? `<div class="tabs">${[['mine', `Čeká na mě (${myWaiting().length})`], ['all', 'Vše'], ['done', `Schválené (${cnt.done})`]]
    .map(([v, l]) => `<button type="button" data-f="${v}" class="${f === v ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>` : '';
  const back = admin ? '' : `<p class="back"><button type="button" class="link" data-overview>← Zpět na moje úkoly</button></p>`;
  const waves = WAVES.map(w => { const list = BAL.filter(b => b.w === w.id && vis(b)); return list.length ? renderWave(w, list, admin) : ''; }).join('');
  return `${back}
    <div class="sum"><span class="big">${cnt.done} z ${n} schváleno</span>
      <div class="bar"><span class="c-done" style="width:${pct(cnt.done)}"></span><span class="c-red" style="width:${pct(cnt.red)}"></span><span class="c-gestor" style="width:${pct(cnt.gestor)}"></span><span class="c-jarda" style="width:${pct(cnt.jarda)}"></span></div>
      <div class="legend"><span><i class="sw c-jarda"></i>u Jardy <b>${cnt.jarda}</b></span><span><i class="sw c-gestor"></i>u gestorů <b>${cnt.gestor}</b></span><span><i class="sw c-red"></i>u ředitelky <b>${cnt.red}</b></span><span><i class="sw c-done"></i>schváleno <b>${cnt.done}</b></span></div>
    </div>
    ${tabs}
    ${waves || `<div class="empty">${f === 'mine' ? 'Teď na tebe nic nečeká.' : 'Nic tu není.'}</div>`}`;
}

function renderWave(w, list, admin) {
  const all = BAL.filter(b => b.w === w.id), done = all.filter(b => stage(b) === 'done').length;
  const v = S.vlny[w.id] || emptyVlna(), closed = S.closed.has(w.id);
  const allDone = done === all.length;
  let cnt = `${done} z ${all.length}`, cls = '';
  if (allDone && w.id !== 'X') { cls = 'done'; cnt = v.seznameni ? 'Hotovo' : v.podepsano ? 'Podepsáno, chybí seznámení' : 'K podpisu rozhodnutí'; }
  const showMeta = admin && w.id !== 'X' && (allDone || v.rozhodnuti || v.ucinnost || v.podepsano || v.seznameni);
  const meta = showMeta ? `<div class="wave-meta" data-w="${w.id}">
      <label>Rozhodnutí č. <input type="text" data-wf="rozhodnuti" value="${esc(v.rozhodnuti)}" placeholder="${esc(w.dec)}"></label>
      <label>Účinnost od <input type="date" data-wf="ucinnost" value="${esc(v.ucinnost)}"></label>
      <label><input type="checkbox" data-wc="podepsano" ${v.podepsano ? 'checked' : ''}> Podepsáno</label>
      <label><input type="checkbox" data-wc="seznameni" ${v.seznameni ? 'checked' : ''}> Zaměstnanci seznámeni</label>
      ${w.rusi ? `<span class="rusi"><b>Ruší:</b> ${esc(w.rusi)}</span>` : ''}</div>` : '';
  return `<section class="wave${closed ? ' closed' : ''}" data-w="${w.id}">
    <div class="wave-h" data-wtoggle="${w.id}"><span class="chev">▼</span><h2>${w.id === 'X' ? '' : w.id + ' · '}${esc(w.t)}</h2><span class="sq">${esc(w.sq)}</span><span class="cnt ${cls}">${esc(cnt)}</span></div>
    <div class="wave-body">
      ${w.note ? `<p class="wave-note">${esc(w.note)}</p>` : ''}
      ${meta}
      <div class="list">${list.map(b => renderRow(b, admin)).join('')}</div>
    </div></section>`;
}

function renderRow(b, admin) {
  const s = st(b.id), sg = stage(b), k = nextStep(b), h = holder(b), open = S.open.has(b.id), busy = S.busy.has(b.id) ? 'disabled' : '';
  const back = k === 'precteno' && s.vraceno;
  const pg = pages(b);
  let act = '';
  if (admin && k && h === 'jarda') act = `<button type="button" class="primary" data-act="${k}" ${busy}>${k === 'precteno' ? 'Pročetl jsem' : k === 'odeslano' ? `Poslal jsem ${P[b.g].d}` : 'Předal jsem ředitelce'}</button>`;
  return `<div class="bal" data-id="${b.id}">
    <div class="bal-h"><div><div class="n">${esc(b.t)}</div><div class="g">${esc(P[b.g].n)} · ${plural(b.d.length, 'dokument', 'dokumenty', 'dokumentů')}${pg ? ` · ${pg} str.` : ''}</div></div>
      <span class="chip st-${back ? 'back' : sg}">${esc(statusText(b))}</span>
      <span class="a">${act}</span></div>
    ${open ? renderDetail(b, admin) : ''}
  </div>`;
}

function renderDetail(b, admin) {
  const s = st(b.id), k = nextStep(b), h = holder(b), last = lastDone(b), busy = S.busy.has(b.id) ? 'disabled' : '';
  const rows = b.d.map(c => { const d = DOCS[c] || { n: c };
    return `<tr><td class="code">${c}</td><td>${esc(d.n)}${d.p ? `<div class="dp">včetně: ${esc(d.p)}</div>` : ''}</td><td class="r">${d.v ? 'v' + esc(d.v) : ''}</td><td class="r">${d.x ? 'tabulka' : d.s ? d.s + ' str.' : ''}</td></tr>`; }).join('');
  const hist = (s.hist || []).map(e => {
    let t;
    if (e.k === 'vraceno') t = `${esc(P[e.u]?.n || '')} ${vb(e.u, 'vrátil')} s připomínkami: <span class="x">${esc(e.x)}</span>`;
    else if (e.k === 'zpet') t = `<span class="muted">${esc(P[e.u]?.n || '')} ${vb(e.u, 'vzal')} zpět: ${esc(stepName(b, e.x) || e.x)}</span>`;
    else { t = esc(stepName(b, e.k)); if (e.u !== actor(b, e.k)) t += ` <span class="muted">(zapsal${P[e.u]?.m ? '' : 'a'} ${esc(P[e.u]?.n || '')})</span>`; }
    return `<li><span class="d" title="${esc(full(e.t))}">${dm(e.t)}</span><span>${t}</span></li>`;
  }).join('');
  const btns = [];
  if (admin && k && h !== 'jarda') btns.push(`<button type="button" data-act="${k}" ${busy}>Zapsat za ${esc(P[h].a)}: ${esc(stepName(b, k))}</button>`);
  if (admin && last) btns.push(`<button type="button" class="ghost" data-undo="${last}" ${busy}>Vzít zpět: ${esc(stepName(b, last))}</button>`);
  return `<div class="bal-b">
    ${s.vraceno ? `<div class="vr"><b>${esc(P[s.vraceno.u]?.n || '')} ${vb(s.vraceno.u, 'vrátil')} ${dm(s.vraceno.t)}:</b> ${esc(s.vraceno.x)}</div>` : ''}
    <table class="docs"><tbody>${rows}</tbody></table>
    ${hist ? `<ul class="tl">${hist}</ul>` : ''}
    ${btns.length ? `<div class="row">${btns.join('')}</div>` : ''}
  </div>`;
}

function render() {
  if (!S.ready.b || !S.ready.v || !S.user) return;
  const ae = document.activeElement;
  if (ae && $('#main').contains(ae) && ae.matches('input[type=text], input[type=date]')) { S.pending = true; return; }
  S.pending = false;
  const simple = S.user !== 'jarda' && !S.overview;
  $('#main').innerHTML = simple ? renderSimple() : renderOverview();
  $('#me').innerHTML = `<b>${esc(P[S.user].n)}</b>`; $('#me').hidden = false;
  $('#b-links').hidden = !(S.user === 'jarda' && api && !api.local);
}

// ---------- stav a hlášky ----------
function setStatus(t, err) { const s = $('#status'); s.textContent = t || ''; s.className = 'status' + (err ? ' err' : ''); }
let toastT, toastUndo = null;
function toast(t, undoFn) {
  $('#toast-t').textContent = t; toastUndo = undoFn || null; $('#toast-undo').hidden = !undoFn;
  $('#toast').classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').classList.remove('on'); toastUndo = null; }, undoFn ? 9000 : 2600);
}
$('#toast-undo').addEventListener('click', () => { const f = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (f) f(); });

// ---------- události ----------
$('#main').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn?.hasAttribute('data-overview')) { S.overview = !S.overview; render(); window.scrollTo(0, 0); return; }
  if (btn?.dataset.f) { S.filter = btn.dataset.f; ls.set(LS_FILTER, S.filter); render(); return; }
  const wt = e.target.closest('[data-wtoggle]');
  if (wt) { const w = wt.dataset.wtoggle; S.closed.has(w) ? S.closed.delete(w) : S.closed.add(w); ls.set(LS_CLOSED, [...S.closed].join(',')); render(); return; }
  const el = e.target.closest('[data-id]'); if (!el) return;
  const b = BY_ID[el.dataset.id];
  if (btn?.dataset.act) { doStep(b, btn.dataset.act); return; }
  if (btn?.dataset.undo) { if (confirm(`Vzít zpět krok „${stepName(b, btn.dataset.undo)}“?`)) undo(b, btn.dataset.undo); return; }
  if (btn?.hasAttribute('data-ret')) { openReturn(b); return; }
  if (e.target.closest('.bal-h')) { S.open.has(b.id) ? S.open.delete(b.id) : S.open.add(b.id); render(); }
});
$('#main').addEventListener('change', e => {
  const t = e.target, wm = t.closest('.wave-meta'); if (!wm || S.user !== 'jarda') return;
  const wid = wm.dataset.w, me = S.user;
  if (t.dataset.wf) { const val = t.value.trim(); doWave(wid, cur => { cur[t.dataset.wf] = val; }); }
  if (t.dataset.wc) { const on = t.checked; doWave(wid, cur => { cur[t.dataset.wc] = on ? { u: me, t: nowIso() } : null; }); }
});
$('#main').addEventListener('focusout', () => setTimeout(() => { if (S.pending) render(); }, 0));
$('#main').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[type=text]')) e.target.blur(); });

let retB = null;
function openReturn(b) {
  retB = b; $('#ret-text').value = '';
  $('#ret-title').textContent = `Připomínky: ${b.t}`;
  $('#dlg-ret').showModal(); setTimeout(() => $('#ret-text').focus(), 30);
}
$('#ret-form').addEventListener('submit', e => { const x = $('#ret-text').value.trim(); if (!x) { e.preventDefault(); return; } if (retB) doReturn(retB, x); retB = null; });
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === d) d.close(); }));

// ---------- kdo jsem a odkazy ----------
function showWho() {
  $('#main').hidden = true; $('#who').hidden = false; $('#me').hidden = true;
  $('#pick').innerHTML = PEOPLE.map(p => `<button type="button" data-u="${p}">${esc(P[p].n)}</button>`).join('');
}
$('#pick').addEventListener('click', e => { const b = e.target.closest('button[data-u]'); if (b) setUser(b.dataset.u); });
function setUser(u) {
  if (!P[u]) return;
  S.user = u; ls.set(LS_USER, u);
  $('#who').hidden = true; $('#main').hidden = false; render();
}
$('#b-links').addEventListener('click', () => {
  const key = ls.get(LS_KEY) || '';
  const base = location.origin + location.pathname + '#k=' + encodeURIComponent(key);
  $('#links').innerHTML = PEOPLE.map(p => `<div class="link-row"><span>${esc(P[p].n)}</span><input readonly value="${esc(base + '&u=' + p)}"><button type="button" data-copy>Kopírovat</button></div>`).join('')
    + '<p class="hint">Každý dostane svůj odkaz. Kdo má odkaz, vidí celé schvalování.</p>';
  $('#dlg-links').showModal();
});
$('#links').addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const inp = b.parentElement.querySelector('input');
  try { await navigator.clipboard.writeText(inp.value); toast('Odkaz zkopírován'); } catch (_) { inp.select(); }
});

// ---------- data ----------
function onBal(entries) { S.bal = Object.fromEntries(entries); S.ready.b = true; render(); }
function onVlny(entries) { S.vlny = Object.fromEntries(entries); S.ready.v = true; render(); }
const norm = d => ({ ...emptyBal(), ...d, kroky: { ...(d?.kroky || {}) }, pozn: { ...(d?.pozn || {}) }, hist: [...(d?.hist || [])] });

async function connectFirebase(key) {
  const [{ initializeApp }, F] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);
  const app = initializeApp(FIREBASE, 'rd');
  let db; try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); }
  const balCol = F.collection(db, ROOT, key, 'balicky'), vlnyCol = F.collection(db, ROOT, key, 'vlny');
  const denied = e => {
    console.error(e);
    if (e && e.code === 'permission-denied') { ls.set(LS_KEY, null); showGate('Odkaz neplatí. Otevřete prosím znovu odkaz, který vám poslal Jarda.'); }
    else setStatus('Spojení se ztratilo, obnovte stránku.', true);
  };
  F.onSnapshot(balCol, s => onBal(s.docs.map(d => [d.id, d.data()])), denied);
  F.onSnapshot(vlnyCol, s => onVlny(s.docs.map(d => [d.id, d.data()])), denied);
  const tx = (col, id, empty, fn) => F.runTransaction(db, async t => {
    const ref = F.doc(col, id), snap = await t.get(ref);
    const cur = snap.exists() ? (col === balCol ? norm(snap.data()) : { ...empty(), ...snap.data() }) : empty();
    fn(cur); cur.upr = nowIso(); t.set(ref, cur);
  });
  api = { bal: (id, fn) => tx(balCol, id, emptyBal, fn), vlna: (id, fn) => tx(vlnyCol, id, emptyVlna, fn) };
}
function connectLocal() {
  const load = () => { try { return JSON.parse(localStorage.getItem(LS_DEMO)) || {}; } catch (e) { return {}; } };
  const db = load(); db.balicky = db.balicky || {}; db.vlny = db.vlny || {};
  const persist = () => { try { localStorage.setItem(LS_DEMO, JSON.stringify(db)); } catch (e) {} };
  const upd = async (coll, id, empty, fn, cb) => {
    await new Promise(r => setTimeout(r, 60));
    const cur = db[coll][id] ? (coll === 'balicky' ? norm(db[coll][id]) : { ...empty(), ...db[coll][id] }) : empty();
    fn(cur); cur.upr = nowIso(); db[coll][id] = JSON.parse(JSON.stringify(cur)); persist(); cb(Object.entries(db[coll]));
  };
  api = { local: true, bal: (id, fn) => upd('balicky', id, emptyBal, fn, onBal), vlna: (id, fn) => upd('vlny', id, emptyVlna, fn, onVlny) };
  onBal(Object.entries(db.balicky)); onVlny(Object.entries(db.vlny));
  setStatus('Zkušební režim');
}

// ---------- přístup ----------
function showGate(msg) {
  $('#main').hidden = true; $('#who').hidden = true; $('#me').hidden = true; $('#b-links').hidden = true;
  $('#gate').hidden = false; if (msg) $('#gate-msg').textContent = msg;
}
$('#gate-form').addEventListener('submit', e => { e.preventDefault(); const k = $('#gate-key').value.trim(); if (k) { ls.set(LS_KEY, k); location.hash = ''; location.reload(); } });
function start() {
  const params = new URLSearchParams(location.search);
  const hk = /[#&]k=([^&]+)/.exec(location.hash), hu = /[#&]u=([a-z]+)/.exec(location.hash);
  if (hu && P[hu[1]]) { ls.set(LS_USER, hu[1]); ls.set(LS_FILTER, null); }
  if (hk) ls.set(LS_KEY, decodeURIComponent(hk[1]));
  if (hk || hu) history.replaceState(null, '', location.pathname + location.search);
  S.closed = new Set((ls.get(LS_CLOSED) || '').split(',').filter(Boolean));
  S.filter = ls.get(LS_FILTER);
  if (params.has('demo')) connectLocal();
  else {
    const key = ls.get(LS_KEY);
    if (!key) return showGate();
    setStatus('Načítám…');
    connectFirebase(key).then(() => setStatus('')).catch(e => { console.error(e); setStatus('Nepodařilo se připojit. Obnovte stránku.', true); });
  }
  const u = ls.get(LS_USER);
  if (u && P[u]) { S.user = u; $('#main').hidden = false; render(); }
  else showWho();
}
window.addEventListener('hashchange', () => { if (/[#&](k|u)=/.test(location.hash)) location.reload(); });
start();
</script>
</body>
</html>
